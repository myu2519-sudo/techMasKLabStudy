<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>セクショニングルート</title>
    </head>
    <body>
        <details>
         <h1>追加の詳細情報</h1>
         <p>詳細を書きます。</p>   
        </details>
        <blockquote>
            <h2>引用の見出し</h2>
            <p>引用文を書きます。</p>
        </blockquote>
        <fieldset>
            <h3>フォームのグループ</h3>
            <p>フォームの説明を書きます。</p>
        </fieldset>
        <figure>
             <h3>コンテンツのグループ</h3>
            <p>コンテンツの説明を書きます。</p>
        </figure>
        
        <table>
            <tr>
                <td>
                  <h2>テーブルの見出し</h2>
            <p>テーブル内の内容。</p>  
                </td>
            </tr>
        </table>
    </body>
</html>
