    <script>
        alert("XXを関数で確認します")

        function Four(num){
            if (num >= 4){
                console.log("値は４以上です。");
            } else {
                console.log("値は４未満です。");
            }
            }

        function Ten(num){
            if (num >= 10){
                console.log("値は１０以上です。");
            } else {
                console.log("値は１０未満です。");
            }
            }

        let value = 5

        Four(value);
        Ten(value);
        
    </script>
