<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Canvas APIを利用しよう！(2)</title>
</head>

<body>
    <h2>Canvasでアニメーションを描く</h2>
    <p>図形を表示するには、canvasタグをサポートしたブラウザが必要です。</p>
    <canvas id="circleCanvas">
    </canvas>
  <script type="text/JavaScript">
    
    var canvas = document.getElementById("circleCanvas");
    if(canvas.getContext)
    var context = canvas.getContext("2d");
    var image = new Image();
    
    image.src = "https://techup.tokyo/wp-content/uploads/2022/05/gosticon.png";
    
    image.onload = function() {

      canvas.width = 400;  
      canvas.height = 400;  

      var centerX = canvas.width / 2;
      var centerY = canvas.height / 2;

      var radius = 120;

      var angle = 0;

      function animate() {
        context.clearRect(0, 0, canvas.width, canvas.height);

        var x = centerX + Math.cos(angle) * radius;
        var y = centerY + Math.sin(angle) * radius;

        context.drawImage(image, x - 25, y - 25, 50, 50);

        angle += 0.03;

        requestAnimationFrame(animate);
      }

      animate();
    };
  </script>
</body>
</html>
