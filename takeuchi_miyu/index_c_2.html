<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS スタイルの継承</title>
    <style>
      .parent_1 {
        background: #ffffff;
        border: solid 5px red;
        margin: 10px;
        padding: 1px;
        text-align: left;
      }

      .child_1 {
        background: #ffffff;
        border: solid 5px yellow;
        margin-left: 1em;   
        padding: 1px;
        text-align: left;
      }

      .child_2 {
        background: #ffffff;
        border: solid 5px green;
        margin-left: 1em;
        padding: 1px;
        text-align: left;
      }
    </style>
  </head>

  <body>
    <div class="parent_1">
      継承テスト1
      <div class="child_1">
        継承テスト2
        <div class="child_2">
          継承テスト3
        </div>
      </div>
    </div>
  </body>
</html>
