<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>絶対配置</title>
        <style>
            body{
                margin:0;
                padding: 0;
                background-color: #FFFFFF;
            }

            .wrapper{
                position: relative;
                left: 0;
                top:10px;
                width: 700px;
                height: 300px;
                background-color: #CC0000; 
            }

            .middle-box{
                position:absolute;
                width: 400px;
                height: 200px;
                background-color: #9999FF;
                z-index: 5;
                top: 50%;
                left :50%;
                transform: translate(-50%,-50%);
            }

            .logo{
                position: absolute;
               background-color: #FFFFFF;
               z-index: 10;
               width: 300px;
               height: 100px;
               top:50%;
               left:50%;
               transform: translate(-50%,-50%);

               display: flex;
               justify-content: center;
               align-items: center;
               color: black;
               font-size:28px;
               font-family: "Yu Gothic UI",sans-serif;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="middle-box">
                <div class="logo">絶対配置</div>
            </div>
        </div>
    </body>
</html>
