<!DOCTYPE html>
<html lang = "ja">
    <head>
    <meta charset="UTF-8" />
    <title>C</title>
    </head>
    <body>
        <p>JavaScriptBasic</p>

        <script>
            let year = 2022;
            let eto;

            switch(year){
                case 2020:
                    eto = "子";
                    break
                case 2021:
                    eto = "丑";
                    break;
                case 2022:
                    eto = "寅"
                    break;
                case 2023:
                    eto = "卯"
                    break;
                case 2024:
                    eto = "辰"
                    break;
                case 2025:
                    eto = "巳"
                    break;
                case 2026:
                    eto = "午"
                    break;
                case 2027:
                    eto = "未"
                    break;
                case 2028:
                    eto = "申"
                    break;
                case 2029:
                    eto = "酉"
                    break;
                case 2030:
                    eto = "戌"
                    break;
                case 2031:
                    eto = "亥"
                    break;
                default:
                    eto = "それ以外"
            }
            console.log(eto);
        </script>
    </body>
</html>
