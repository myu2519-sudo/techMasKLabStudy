<!DOCTYPE html>
<html>
<head>
  <title>index_c_7</title>
  <style>
    .box {
      background-color: #ffebe9;     
      border-top: 5px solid #ff7d6e;    
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin: 10px;
      padding: 20px;
    }

    .box p {
      color: #ff7d6e;   
      margin: 0;        
    }
  </style>
</head>
<body>

  <div class="box">
    <p>このような影（box-shadow）をつけて少し浮いたように見せた枠を作成してください。</p>
  </div>

</body>
</html>
