<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像の配置</title>
</head>
<style>
    .sample_img1{
        background: url(https://techup.tokyo/wp-content/uploads/2021/12/image2.jpg)no-repeat 0 0;
        background-size: cover;
        position: relative;
        margin: 0 auto;
        text-align: center;
        width: 640px;
        height: 358px;
    }

    .sample_img2{
        position: absolute;
        top: 0px;
        left: 0px;
    }

    img{
        width: 200px;
        height: auto;
    }
</style>

<body>
    <div class ="sample_img1">
        <div class="sample_img2">
            <img src="https://techup.tokyo/wp-content/uploads/2021/12/image1.jpg">
        </div>
        </div>
</body>
</html>
